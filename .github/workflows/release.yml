name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Version.number
        run: |
          version=$(grep 'static let number' Wallpaper/CLI/Commands/VersionCommand.swift | sed 's/.*= "\(.*\)"/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match Version.number $version" >&2
            exit 1
          fi

      - name: Build (Release)
        run: xcodebuild -project Wallpaper.xcodeproj -scheme Wallpaper -configuration Release build -derivedDataPath build -quiet CODE_SIGNING_ALLOWED=NO

      - name: Package
        run: |
          cp build/Build/Products/Release/Wallpaper vw
          codesign -f -s - vw
          codesign -v vw
          tar -czf vw-macos-arm64.tar.gz vw

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vw-macos-arm64.tar.gz --generate-notes --title "$GITHUB_REF_NAME"
